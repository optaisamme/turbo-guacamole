<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where to click to start a job search on GitHub</title>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff" stroke="#d0d7de" rx="8"/>

  <!-- repository header -->
  <rect x="1" y="1" width="898" height="98" fill="#f6f8fa" rx="8"/>
  <text x="24" y="38" font-size="18" fill="#0969da">your-username / <tspan font-weight="700">my-job-search</tspan></text>
  <text x="24" y="58" font-size="12" fill="#57606a">(your own copy: the name starts with YOUR GitHub username)</text>

  <!-- tabs -->
  <text x="24" y="88" font-size="14" fill="#24292f">Code</text>
  <text x="84" y="88" font-size="14" fill="#24292f">Issues</text>
  <text x="152" y="88" font-size="14" fill="#24292f">Pull requests</text>
  <rect x="262" y="70" width="74" height="28" fill="#fff8c5" stroke="#bf8700" stroke-width="2" rx="6"/>
  <text x="276" y="89" font-size="14" font-weight="700" fill="#24292f">Actions</text>
  <text x="372" y="88" font-size="14" fill="#24292f">Projects</text>
  <text x="446" y="88" font-size="14" fill="#24292f">Settings</text>
  <circle cx="353" cy="84" r="13" fill="#cf222e"/><text x="353" y="89" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <line x1="0" y1="99" x2="900" y2="99" stroke="#d0d7de"/>

  <!-- left sidebar -->
  <text x="24" y="135" font-size="16" font-weight="700" fill="#24292f">Actions</text>
  <text x="24" y="165" font-size="13" fill="#57606a">All workflows</text>
  <rect x="16" y="178" width="190" height="30" fill="#fff8c5" stroke="#bf8700" stroke-width="2" rx="6"/>
  <text x="28" y="198" font-size="14" font-weight="700" fill="#24292f">Run job search</text>
  <circle cx="220" cy="193" r="13" fill="#cf222e"/><text x="220" y="198" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <line x1="240" y1="110" x2="240" y2="490" stroke="#d0d7de"/>

  <!-- main area -->
  <text x="262" y="135" font-size="18" font-weight="700" fill="#24292f">Run job search</text>
  <rect x="262" y="155" width="616" height="44" fill="#ddf4ff" stroke="#54aeff" rx="6"/>
  <text x="276" y="182" font-size="13" fill="#24292f">This workflow has a workflow_dispatch event trigger.</text>
  <rect x="740" y="163" width="126" height="28" fill="#f6f8fa" stroke="#bf8700" stroke-width="2" rx="6"/>
  <text x="756" y="182" font-size="13" font-weight="700" fill="#24292f">Run workflow  ▾</text>
  <circle cx="726" cy="150" r="13" fill="#cf222e"/><text x="726" y="155" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- dropdown -->
  <rect x="596" y="204" width="282" height="128" fill="#ffffff" stroke="#8c959f" rx="6"/>
  <text x="612" y="230" font-size="13" fill="#24292f">Use workflow from</text>
  <rect x="612" y="240" width="140" height="26" fill="#f6f8fa" stroke="#d0d7de" rx="6"/>
  <text x="622" y="258" font-size="12" fill="#24292f">Branch: main  ▾</text>
  <text x="762" y="258" font-size="11" fill="#57606a">(leave as is)</text>
  <rect x="612" y="282" width="120" height="32" fill="#1f883d" stroke="#bf8700" stroke-width="2" rx="6"/>
  <text x="672" y="303" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Run workflow</text>
  <circle cx="748" cy="298" r="13" fill="#cf222e"/><text x="748" y="303" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <!-- runs list -->
  <text x="262" y="232" font-size="13" fill="#57606a">Runs appear here:</text>
  <circle cx="272" cy="258" r="7" fill="#bf8700"/><text x="288" y="263" font-size="13" fill="#24292f">yellow = searching</text>
  <circle cx="272" cy="284" r="7" fill="#1f883d"/><text x="288" y="289" font-size="13" fill="#24292f">green check = done</text>
  <circle cx="272" cy="310" r="7" fill="#cf222e"/><text x="288" y="315" font-size="13" fill="#24292f">red X = needs a fix</text>

  <!-- legend -->
  <line x1="262" y1="350" x2="878" y2="350" stroke="#d0d7de"/>
  <text x="262" y="378" font-size="14" fill="#24292f"><tspan font-weight="700">1</tspan>  Click the <tspan font-weight="700">Actions</tspan> tab at the top of your copy.</text>
  <text x="262" y="404" font-size="14" fill="#24292f"><tspan font-weight="700">2</tspan>  On the left, click <tspan font-weight="700">Run job search</tspan>.</text>
  <text x="262" y="430" font-size="14" fill="#24292f"><tspan font-weight="700">3</tspan>  On the right, click the grey <tspan font-weight="700">Run workflow</tspan> button. A box opens.</text>
  <text x="262" y="456" font-size="14" fill="#24292f"><tspan font-weight="700">4</tspan>  In the box, click the green <tspan font-weight="700">Run workflow</tspan> button.</text>
  <text x="262" y="482" font-size="12" fill="#57606a">Wait 5 seconds and refresh the page. Results take 10 to 20 minutes.</text>
</svg>
